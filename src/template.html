<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Konrad Szafer</title>
  <meta name="description" content="Konrad Szafer, PhD student in Computer Science at ETH Zurich working on adaptation, continual learning, reinforcement learning, and systems.">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YJX8LM4892"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YJX8LM4892');
  </script>

  <!-- Apply the saved or system theme before the first paint -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <nav>
      <ul>
{{ nav }}
        <li>
          <button class="theme-toggle" type="button" aria-label="Switch color theme">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2 6 6M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
{{ main }}
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.querySelector('.theme-toggle');

      function updateLabel() {
        var dark = root.getAttribute('data-theme') === 'dark';
        toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }

      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        updateLabel();
      });

      updateLabel();
    })();
  </script>
</body>
</html>
